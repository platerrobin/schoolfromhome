<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School From Home - Portal</title>
    <style>
        :root { --primary: #2563eb; --bg-main: #f8fafc; --text-dark: #1e293b; --border-color: #cbd5e1; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-dark); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); width: 100%; max-width: 500px; text-align: center; }
        .portal-layout { max-width: 1000px; text-align: left; }
        h1 { color: var(--primary); margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; }
        button { width: 100%; background-color: var(--primary); color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; }
        .hidden { display: none !important; }
        .student-card { background: #f1f5f9; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
        .grid-dashboard { display: grid; gap: 20px; margin-top: 20px; }
        .error-msg { color: #dc2626; margin-top: 10px; }
        .workspace-frame { width: 100%; height: 500px; border: 1px solid var(--border-color); }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="container">
        <h1>School From Home</h1>
        <select id="username">
            <option value="" disabled selected>Choose account...</option>
            <option value="admin">Admin</option>
            <option value="Jayce">Jayce</option>
        </select>
        <input type="password" id="passcode" placeholder="4-digit code" style="margin: 10px 0;">
        <button onclick="handleLogin()">Login</button>
        <div id="loginError" class="error-msg hidden">Invalid credentials.</div>
    </div>
    <!-- DASHBOARDS -->
    <div id="studentDashboard" class="container portal-layout hidden">
        <h1>Welcome Student</h1>
        <iframe class="workspace-frame" id="studentCanvasFrame"></iframe>
        <button onclick="logout()">Log Out</button>
    </div>
    <div id="adminPanel" class="container portal-layout hidden">
        <h1>Admin System</h1>
        <div id="studentListContainer"></div>
        <button onclick="logout()">Exit</button>
    </div>
    <script>
        const students = {
            "Jayce": { name: "Jayce", pin: "1001", embedUrl: "https://wikipedia.org" }
        };
        const adminPin = "8899";
        function handleLogin() {
            const user = document.getElementById('username').value;
            const pin = document.getElementById('passcode').value;
            const errorElement = document.getElementById('loginError');
            if (user === "admin" && pin === adminPin) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
            } else if (students[user] && students[user].pin === pin) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('studentDashboard').classList.remove('hidden');
                document.getElementById('studentCanvasFrame').src = students[user].embedUrl;
            } else {
                errorElement.classList.remove('hidden');
            }
        }
        function logout() { location.reload(); }
    </script>
</body>
</html>
