<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School From Home - Portal</title>
    <style>
        :root { --primary: #2563eb; --primary-dark: #1d4ed8; --bg-main: #f8fafc; --text-dark: #1e293b; --border-color: #cbd5e1; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-dark); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); width: 100%; max-width: 500px; text-align: center; }
        .portal-layout { max-width: 1000px; text-align: left; }
        h1 { color: var(--primary); margin-bottom: 20px; font-size: 24px; }
        h2 { margin-bottom: 15px; font-size: 20px; color: #334155; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 16px; }
        button { width: 100%; background-color: var(--primary); color: white; padding: 12px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        button:hover { background-color: var(--primary-dark); }
        .back-btn { background-color: #64748b; margin-top: 15px; }
        .hidden { display: none !important; }
        .student-card { background: #f1f5f9; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .grid-dashboard { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 20px; }
        @media (min-width: 768px) { .grid-dashboard { grid-template-columns: 2fr 1fr; } }
        .panel-box { background: #f8fafc; border: 1px solid var(--border-color); padding: 20px; border-radius: 8px; }
        .error-msg { color: #dc2626; font-size: 14px; margin-top: 10px; }
        .workspace-frame { width: 100%; height: 550px; border: 1px solid var(--border-color); border-radius: 8px; margin-top: 15px; }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="container">
        <h1>School From Home</h1>
        <h2>Student & Admin Login</h2>
        <div class="form-group">
            <label for="username">Select Identity</label>
            <select id="username">
                <option value="" disabled selected>Choose your account...</option>
                <option value="admin">Administrator Portal</option>
                <option value="Jayce">Jayce (1st/2nd)</option>
                <option value="Brayson">Brayson (3rd)</option>
                <option value="girl3">Girl 3 (5th)</option>
                <option value="Kaydon">Kaydon (6th)</option>
                <option value="Elijah">Elijah (7th)</option>
                <option value="girl1">Girl 1 (12th)</option>
                <option value="girl2">Girl 2 (12th)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="passcode">4-Digit Passcode</label>
            <input type="password" id="passcode" placeholder="Enter code">
        </div>
        <button onclick="handleLogin()">Access Dashboard</button>
        <div id="loginError" class="error-msg hidden">Invalid credentials.</div>
    </div>
    <!-- STUDENT DASHBOARD -->
    <div id="studentDashboard" class="container portal-layout hidden">
        <h1 id="welcomeText">Welcome Student</h1>
        <div class="grid-dashboard">
            <div>
                <h2>Learning Workspace</h2>
                <iframe class="workspace-frame" src="about:blank" id="studentCanvasFrame"></iframe>
            </div>
            <div class="panel-box"><h2>Daily Schedule</h2><p>Lessons & Study Block</p></div>
        </div>
        <button class="back-btn" onclick="logout()">Log Out</button>
    </div>
    <!-- ADMIN PANEL -->
    <div id="adminPanel" class="container portal-layout hidden">
        <h1>Admin System</h1>
        <h2>Roster Management</h2>
        <div id="studentListContainer"></div>
        <button class="back-btn" onclick="logout()">Exit</button>
    </div>
    <script>
        const students = {
            "Jayce": { name: "Jayce", pin: "1001", url: "https://wikipedia.org" },
            "Brayson": { name: "Brayson", pin: "1002", url: "https://wikipedia.org" },
            "girl3": { name: "Girl 3", pin: "1003", url: "https://wikipedia.org" },
            "Kaydon": { name: "Kaydon", pin: "1004", url: "https://wikipedia.org" },
            "Elijah": { name: "Elijah", pin: "1005", url: "https://wikipedia.org" },
            "girl1": { name: "Girl 1", pin: "1006", url: "https://wikipedia.org" },
            "girl2": { name: "Girl 2", pin: "1007", url: "https://wikipedia.org" }
        };
        const adminPin = "8899";
        function loadAdminPanel() {
            const container = document.getElementById('studentListContainer');
            container.innerHTML = '';
            Object.keys(students).forEach(key => {
                const s = students[key];
                const node = document.createElement('div');
                node.className = 'student-card';
                node.innerHTML = `<h3>${s.name}</h3><p>PIN: ${s.pin}</p>`;
                container.appendChild(node);
            });
        }
        function handleLogin() {
            const user = document.getElementById('username').value;
            const pin = document.getElementById('passcode').value;
            const errorElement = document.getElementById('loginError');
            if (user === "admin" && pin === adminPin) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loadAdminPanel();
            } else if (students[user] && students[user].pin === pin) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('studentDashboard').classList.remove('hidden');
                document.getElementById('welcomeText').innerText = `Welcome, ${students[user].name}!`;
                document.getElementById('studentCanvasFrame').src = students[user].url;
            } else { errorElement.classList.remove('hidden'); }
        }
        function logout() { location.reload(); }
    </script>
</body>
</html>
