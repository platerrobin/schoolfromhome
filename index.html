<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School From Home - Portal</title>
    <style>
        :root { --primary: #2563eb; --bg-main: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); width: 100%; max-width: 500px; text-align: center; }
        .portal-layout { max-width: 1000px; text-align: left; }
        h1 { color: var(--primary); margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #cbd5e1; border-radius: 6px; }
        button { width: 100%; background-color: var(--primary); color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background-color: #1d4ed8; }
        .hidden { display: none !important; }
        .error-msg { color: #dc2626; margin-top: 10px; font-weight: 500; }
        .workspace-frame { width: 100%; height: 500px; border: 1px solid #cbd5e1; margin-top: 15px; }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="container">
        <h1>School From Home</h1>
        <div class="form-group">
            <label>Select Workspace</label>
            <select id="username">
                <option value="admin">Administrator Portal</option>
                <option value="Jayce">Jayce</option>
            </select>
        </div>
        <div class="form-group">
            <label>Secure Passcode</label>
            <input type="password" id="passcode" placeholder="Enter 4-digit code">
        </div>
        <button onclick="handleLogin()">Access Dashboard</button>
        <div id="loginError" class="error-msg hidden">Invalid credentials.</div>
    </div>
    <!-- DASHBOARD & ADMIN (Simplified) -->
    <div id="studentDashboard" class="container portal-layout hidden">
        <h1 id="welcomeText">Welcome</h1>
        <iframe class="workspace-frame" src="about:blank" id="studentCanvasFrame"></iframe>
        <button onclick="logout()">Log Out</button>
    </div>
    <script>
        // FIXED TYPO HERE: handeLogin -> handleLogin
        function handleLogin() {
            const user = document.getElementById('username').value;
            const pin = document.getElementById('passcode').value;
            if (user === "admin" && pin === "8899") {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('studentDashboard').classList.remove('hidden');
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }
        function logout() {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('studentDashboard').classList.add('hidden');
        }
    </script>
</body>
</html>
